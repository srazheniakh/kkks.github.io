        }

            width: 100%;

            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);

            flex-direction: column;
            justify-content: space-between;
        }

            margin-bottom: 25px;
        }

            color: #666;
            margin: 0 0 5px 0;
        }

            font-size: 0.9rem;
            color: #888;
        }

        .description-box {
            font-size: 1.1rem;
            line-height: 1.8;
            min-height: 120px;
            background: #fdfdfd;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            white-space: pre-wrap;
        }

        /* 答えのエリア */
        .answer-container {
            border-top: 2px dashed #ddd;
            padding-top: 20px;
            text-align: center;
        }

        .answer-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d9534f;
            min-height: 40px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            visibility: hidden;
        }

        /* ボタン */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-show {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-show:hover {
            background-color: #357abd;
        }

        .btn-next {
            background-color: #5cb85c;
            color: white;
        }

        .btn-next:hover {
            background-color: #4cae4c;
        }

    let currentIndex = 0;

    function loadQuestion() {
        const currentQuiz = quizData[currentIndex];
        document.getElementById("description").innerText = currentQuiz.description;
        document.getElementById("answer").innerText = currentQuiz.answer;
        document.getElementById("answer").classList.add("hidden");
        document.getElementById("progress").innerText = `問題 ${currentIndex + 1} / ${quizData.length}`;
    }

    function showAnswer() {
        document.getElementById("answer").classList.remove("hidden");
    }

    function nextQuestion() {
        currentIndex = (currentIndex + 1) % quizData.length;
        loadQuestion();
